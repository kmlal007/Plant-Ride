<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Plant-Ride">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4469"/>
      <stop offset="1" stop-color="#0B1F33"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F26B1D"/>
      <stop offset="1" stop-color="#FFA94D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Plant skyline hint -->
  <path d="M60 420 V330 h44 v-40 h30 v40 h40 V420 Z" fill="#ffffff" opacity="0.07"/>
  <path d="M380 420 V300 h28 v-60 h22 v180 Z" fill="#ffffff" opacity="0.07"/>
  <!-- Route forming a P -->
  <g transform="translate(-14 -24)">
  <path d="M184 396 V164 H292 a86 86 0 0 1 0 172 H236" fill="none" stroke="url(#route)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stop at the start of the route -->
  <circle cx="184" cy="396" r="34" fill="#ffffff"/>
  <circle cx="184" cy="396" r="15" fill="#0B1F33"/>
  <!-- Vehicle on the route -->
  <circle cx="362" cy="250" r="20" fill="#ffffff"/>
  </g>
</svg>
