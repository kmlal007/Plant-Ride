spring:
  application:
    name: plantride
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plantride}
    username: ${DB_USER:plantride}
    password: ${DB_PASSWORD:plantride}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  # Honour X-Forwarded-* from the reverse proxy (nginx / load balancer) for scheme, host and port.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

plantride:
  jwt:
    # Must be at least 32 bytes. Always override in non-dev environments.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl-hours: ${JWT_TTL_HOURS:12}
  tracking:
    # Shared secret that the GPS gateway (Traccar) sends in the X-Api-Key header.
    api-key: ${TRACKING_API_KEY:dev-tracking-key}
  bootstrap:
    plant-code: ${BOOTSTRAP_PLANT_CODE:PLANT1}
    plant-name: ${BOOTSTRAP_PLANT_NAME:Main Plant}
    admin-login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123}
  demo:
    # Pilot showcase plant "Demo Steel Works" + live simulator. Never enable in production.
    seed: ${SEED_DEMO:false}
    simulator: ${DEMO_SIMULATOR:${SEED_DEMO:false}}
    # Drivers the simulator operates; 9000000001 is left for a human using the driver app.
    bot-driver-logins: ${DEMO_BOT_DRIVERS:9000000002,9000000003,9000000004,9000000005,9000000006,9000000007}
    speed-kmh: ${DEMO_SPEED_KMH:35}
  sweeper-interval-ms: ${SWEEPER_INTERVAL_MS:10000}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  notifications:
    push:
      # fcm (default) | webhook | none. Apps always keep polling as a fallback.
      provider: ${PUSH_PROVIDER:fcm}
      fcm:
        project-id: ${FCM_PROJECT_ID:}
        credentials-file: ${FCM_CREDENTIALS_FILE:}
      webhook:
        url: ${PUSH_WEBHOOK_URL:}
        auth-header: ${PUSH_WEBHOOK_AUTH:}
    sms:
      # none (default, logs only) | webhook
      provider: ${SMS_PROVIDER:none}
      webhook:
        url: ${SMS_WEBHOOK_URL:}
        auth-header: ${SMS_WEBHOOK_AUTH:}
